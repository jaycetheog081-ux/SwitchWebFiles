# .github/workflows/build.yml

name: Build SwitchWebFiles

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Nintendo Switch homebrew
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            devkitpro/devkita64:latest \
            make

      - name: Verify NRO output
        run: |
          if [ ! -f SwitchWebFiles.nro ]; then
            echo "ERROR: SwitchWebFiles.nro was not generated."
            find . -maxdepth 3 -type f
            exit 1
          fi
          ls -lh SwitchWebFiles.nro

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwitchWebFiles-NRO
          path: SwitchWebFiles.nro
          if-no-files-found: error
          retention-days: 7
